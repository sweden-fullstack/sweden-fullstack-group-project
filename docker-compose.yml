services:
    backend:
        image: zona-backend
        container_name: zona-backend
        build:
            context: .
            dockerfile: backend/Dockerfile
        networks:
            - zona-network
        ports:
            - "${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}"
        depends_on:
            db:
                condition: service_healthy
        env_file:
            - .env
    db:
        image: alpine/mysql:15.2
        container_name: zona-database
        networks:
            - zona-network
        environment:
            MYSQL_USER: "${DB_USERNAME}"
            MYSQL_PASSWORD: "${DB_PASSWORD}"
            MYSQL_DATABASE: "${DB_DATABASE}"
        env_file:
            - .env
        healthcheck:
            test: "mysqladmin ping -h 127.0.0.1 -u ${DB_USERNAME} --password=${DB_PASSWORD}"
            start_period: 5s
            interval: 5s
            retries: 5
            timeout: 5s

networks:
    zona-network:
        name: zona-network
